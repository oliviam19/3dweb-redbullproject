<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Design: Red Bull (Home)</title>
    <link rel="stylesheet" type="text/css" href="index.css">
    <link rel="icon" type="image/x-icon" href="Images/favicon.ico" alt="Rebull logo, blue">
</head>
<body>

<header>
    <img class="header-text" src="Images/Header.png" alt="Redbull Logo">

    <nav>
        <ul class="nav-links">
            <li><a href="redbull-index.html">Home Page</a></li>
            <li><a href="redbull-details.html">Project Details</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="hero">
        <img src="Images/Gradient.png" alt="Gradient background pink/cyan/yellow" class="hero-img">
        <img src="Images/Redbull-CutOut.png" alt="Red bull sugar free" class="cut-out">
        <h1>Red Bull Energy Drinks.</h1>
        <h1>Vitalizes Body and Mind</h1>
        <h2>Redbull gives you wiiings.</h2>
    </div>

    <div class="main">
       <div class="product-section">

<!-- Blue Section -->
<figure class="bluephoto">
    <img src="Images/BackgroundBLUE.png" alt="Background photo of water">

    <div class="text-overlay">
        <h3>Red Bull Energy</h3>
        <h3>Iced Vanilla Berry</h3>
        <h3>250mL</h3>
        <h4>$3.20 AUD</h4>
        <img class="bstars" src="Images/stars-blue.png" alt="4/5 Star Rating">
    </div>
    <div>
        <img class="blue-can" src="Images/Blue Scroll Frames/0001.png">
    </div> 
</figure>

<!-- Yellow Section -->
<figure class="yellowphoto">
    <img src="Images/BackgroundYELLOW.png" alt="Background photo of yellow flowers">

    <div class="text-overlay yellow-text">
        <h3>Red Bull Energy</h3>
        <h3>Tropical</h3>
        <h3>250mL</h3>
        <h4>$3.20 AUD</h4>
        <img class="ystars" src="Images/stars-yellow.png" alt="4/5 Star Rating">
    </div>
    <div>
        <img class="yellow-can" src="Images/Yellow Scroll Frames/0001.png">
    </div> 
</figure>

<!-- Pink Section -->
<figure class="pinkphoto">
    <img src="Images/BackgroundPINK.png" alt="Background photo of peaches">

    <div class="text-overlay pink-text">
        <h3>Red Bull Energy</h3>
        <h3>White Peach</h3>
        <h3>250mL</h3>
        <h4>$3.20 AUD</h4>
        <img class="pstars" src="Images/stars-pink.png" alt="4/5 Star Rating">
    </div>
    <div>
        <img class="pink-can" src="Images/Pink Scroll Frames/0001.png">
    </div> 
</figure>

</div>

</main>

<footer>
    <img src="Images/Gradient.png" alt="Gradient background pink/cyan/yellow">    
    <div class="footer-content">
        <p>This website was produced by a Faculty of Arts & Design student.</p> 
        <p>@ University of Canberra, 2026. u3280271.</p>
    </div>
</footer>

<script src="script.js"defer></script>

</body>
</html>
